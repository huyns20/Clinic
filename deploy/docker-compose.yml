services:
  # 1. Cơ sở dữ liệu quan hệ PostgreSQL 17 (kết nối trực tiếp hạ tầng infa)
  postgres:
    image: postgres:latest
    container_name: phongkham_postgres
    environment:
      POSTGRES_DB: phong_kham2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - ../infa/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d phong_kham2"]
      interval: 3s
      timeout: 3s
      retries: 5
    restart: always

  # 2. Backend Java Spring Boot 3 REST API
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    pull_policy: build
    container_name: clinic_backend
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: phong_kham2
      DB_USER: postgres
      DB_PASSWORD: "123456"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # 3. Frontend React + Vite + Tailwind CSS (Nginx Web Server)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    pull_policy: build
    container_name: clinic_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: always
